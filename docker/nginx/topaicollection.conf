# nginx site for https://www.topaicollection.com → app container on 127.0.0.1:3693.
# Copy to /etc/nginx/sites-available/topaicollection.conf, symlink into sites-enabled.
# Certificate: sudo certbot certonly --nginx -d topaicollection.com -d www.topaicollection.com
# The app trusts the last X-Forwarded-For hop (NUXT_TRUST_PROXY=true, server/utils/ads.ts),
# so this must stay the only way in — the container port is bound to 127.0.0.1.

# http:// (both names) → https://www
server {
    listen 80;
    listen [::]:80;
    server_name topaicollection.com www.topaicollection.com;

    # certbot renewals (webroot / nginx plugin)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.topaicollection.com$request_uri; }
}

# https://topaicollection.com → https://www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name topaicollection.com;

    ssl_certificate     /etc/letsencrypt/live/topaicollection.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topaicollection.com/privkey.pem;

    return 301 https://www.topaicollection.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.topaicollection.com;

    ssl_certificate     /etc/letsencrypt/live/topaicollection.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topaicollection.com/privkey.pem;

    # The domain is proxied by Cloudflare: $remote_addr would be a Cloudflare edge, so take
    # the visitor IP from CF-Connecting-IP — only when the request really comes from
    # Cloudflare (anyone else's header is ignored). $remote_addr then becomes the visitor
    # and is the X-Forwarded-For hop the app trusts. Ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Feedback attachments go up to 20 MB, tool images 5 MB (nginx default is 1 MB).
    client_max_body_size 25m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:3693;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, don't append: X-Real-IP / the last X-Forwarded-For hop is the socket IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
