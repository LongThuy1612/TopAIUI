services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Localhost only — the app reaches it over the compose network; from your PC use
    # an SSH tunnel (ssh -L 5432:127.0.0.1:5432 user@server).
    ports:
      - '127.0.0.1:5432:5432'
    command: postgres -c idle_in_transaction_session_timeout=60000 -c statement_timeout=30000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-topainew}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://www.topaicollection.com}
    restart: unless-stopped
    # Localhost only: nginx on the host (docker/nginx/topaicollection.conf) proxies
    # https://www.topaicollection.com here. Must not be reachable directly, since
    # NUXT_TRUST_PROXY trusts the X-Forwarded-For hop nginx appends.
    ports:
      - '127.0.0.1:3693:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-topainew}
      # NUXT_-prefixed vars are read by Nitro at container startup and always
      # override whatever ADMIN_TOKEN/ADMIN_PASSWORD default got baked into
      # the image during `npm run build` (nuxt.config.ts reads plain
      # process.env.ADMIN_* only at build time, so setting the unprefixed
      # names here has no effect without rebuilding the image).
      NUXT_ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme-prod-token}
      # Signs every login token (server/utils/userAuth.ts). Required: without it the
      # image's built-in dev default is used and anyone reading the code can forge
      # sessions. Changing it signs everyone out.
      NUXT_USER_TOKEN_SECRET: ${USER_TOKEN_SECRET:?Set USER_TOKEN_SECRET in .env (e.g. openssl rand -hex 32)}
      NUXT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Stripe checkout (/api/promote/checkout) + webhook (/api/stripe/webhook).
      # Without the secret key every "Pay" returns 500 "Stripe is not configured".
      NUXT_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NUXT_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # false = no Stripe button on promote orders (PayPal is the main payment).
      NUXT_PUBLIC_STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      # PayPal checkout (beside Stripe) + webhook (/api/paypal/webhook). Empty client ID =
      # no "Pay with PayPal" button. PAYPAL_MODE: sandbox | live.
      NUXT_PUBLIC_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      NUXT_PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      NUXT_PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      NUXT_PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      # Public URL of the site — PayPal / Stripe send customers back here after paying.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://www.topaicollection.com}
      # Sign in with Google (OAuth Web client ID). Empty = Google button hidden.
      NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Ad clicks are charged once per visitor IP per day (server/utils/ads.ts).
      # true: nginx on the host forwards to this container and appends the client IP
      # to X-Forwarded-For. Set false only if visitors reach the port directly (the
      # header would then be theirs to fake).
      NUXT_TRUST_PROXY: ${TRUST_PROXY:-true}
      # SMTP for email confirmation + password reset. Empty host = no mail is sent.
      NUXT_SMTP_HOST: ${SMTP_HOST:-}
      NUXT_SMTP_PORT: ${SMTP_PORT:-587}
      NUXT_SMTP_USER: ${SMTP_USER:-}
      NUXT_SMTP_PASS: ${SMTP_PASS:-}
      NUXT_MAIL_FROM: ${MAIL_FROM:-TopAICollection <no-reply@topaicollection.com>}
      # Inbox notified of new Contact-page messages. Empty = SUPPORT_EMAIL (shared/site.ts).
      NUXT_CONTACT_INBOX: ${CONTACT_INBOX:-}
    volumes:
      # Uploaded tool logos / screenshots (nitro storage "uploads", ./.data/uploads).
      - uploads_data:/app/.data/uploads
      # Feedback attachments (nitro storage "feedback", ./.data/feedback) — private.
      - feedback_data:/app/.data/feedback
      # Resized tool images (nitro storage "image-cache", ./.data/image-cache — see
      # server/routes/img.get.ts). Only a cache, but kept across redeploys so images
      # aren't all resized again after each one. Safe to delete at any time.
      - image_cache:/app/.data/image-cache
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped
    # Localhost only — open via ssh -L 8081:127.0.0.1:8081 user@server.
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  feedback_data:
  image_cache:
